name: Publish verified v0.9.6

on:
  push:
    branches:
      - feat/skill-crud-readme-usecases
    paths:
      - .github/workflows/publish-v096.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify v0.9.6 tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: b74263977e1ad2056478b9bbc894288931be261c
          RELEASE_TAG: v0.9.6
        shell: bash
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$RELEASE_SHA"
            echo "$RELEASE_TAG already points at verified main."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_SHA" >/dev/null
            echo "Created $RELEASE_TAG at $RELEASE_SHA."
          fi

      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag=v0.9.6
