name: Sync slash registry release artifacts

on:
  push:
    branches: [feat/slash-skill-registry]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/slash-skill-registry
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run docs:sync
      - run: npm run package:skills
      - name: Commit deterministic generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated files already synchronized."
            exit 0
          fi
          git commit -m "chore(release): sync 0.9.4 generated artifacts"
          git push origin HEAD:feat/slash-skill-registry
