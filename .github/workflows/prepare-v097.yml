name: Prepare v0.9.7

on:
  push:
    branches:
      - feat/skill-search-auto-metadata
    paths:
      - .github/workflows/prepare-v097.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/skill-search-auto-metadata
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Prepare and verify v0.9.7
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-prepare-v097.py
          npm version 0.9.7 --no-git-tag-version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run docs:sync
          npm run package:skills
          npm run verify:release
      - name: Commit verified release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AI_INSTALL.md references/portable-skills.md docs skills/sc-help/SKILL.md package.json package-lock.json .claude-plugin plugins/si-coder dist
          git commit -m "chore(release): prepare SI-Coder v0.9.7"
          git push origin HEAD:feat/skill-search-auto-metadata
