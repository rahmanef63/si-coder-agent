name: Publish verified v0.9.4

on:
  push:
    branches:
      - feat/slash-skill-registry
    paths:
      - .github/workflows/publish-v094.yml

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release tag points at verified main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 3e6d8397bf5c00e44b86621b4f353fc4c42f0529
          RELEASE_TAG: v0.9.4
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$existing" = "$RELEASE_SHA"
          echo "$RELEASE_TAG points at verified main $RELEASE_SHA."

      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v0.9.4
