name: Validate merged main SC CLI

on:
  push:
    branches:
      - fix/sc-cli-skills-ssot-final
    paths:
      - .github/workflows/validate-main-sc-cli.yml

permissions:
  contents: read

jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install linked SC from main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2edff0650f3d4b07dcc00e5408dbe0bf8f656b6b"
          npm ci --ignore-scripts --no-audit --no-fund
          npm link
          command -v sc
          sc skills --json > /tmp/sc-skills.json
          node - <<'NODE'
          const fs = require('fs');
          const out = JSON.parse(fs.readFileSync('/tmp/sc-skills.json', 'utf8'));
          const required = ['sc','sc-all','sc-fe','sc-ui','sc-ux','sc-dx','sc-ax'];
          for (const name of required) {
            if (!out.skills.some(row => row.name === name)) throw new Error(`main installed sc missing ${name}`);
          }
          console.log(`main-installed-count=${out.skills.length}`);
          console.log(`main-required=${required.join(',')}`);
          NODE
          sc skill show sc-fe --json

      - name: Open Skills in the merged main Finder
        shell: bash
        run: |
          set -euo pipefail
          (printf 'skills\r'; sleep 1) | timeout 3s script -qfec 'sc' /tmp/main-sc-tui.raw || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path('/tmp/main-sc-tui.raw').read_text(errors='replace')
          clean = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          clean = re.sub(r'\x1b\][^\x07]*(?:\x07|\x1b\\)', '', clean)
          print(clean[-16000:])
          required = ['SI-Coder › Skills', '/sc-fe', '/sc-ui', '/sc-ux', '/sc-dx', '/sc-ax']
          missing = [item for item in required if item not in clean]
          if missing:
              raise SystemExit(f'merged main Finder missing: {missing}')
          PY
