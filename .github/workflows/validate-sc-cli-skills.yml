name: Validate SC CLI skill SSOT

on:
  push:
    branches:
      - fix/sc-cli-skills-ssot
    paths:
      - .github/workflows/validate-sc-cli-skills.yml
      - bin/**
      - lib/skill-*.js
      - skills/catalog.json
      - test/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/sc-cli-skills-ssot

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install and link actual sc binary
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm link
          command -v sc

      - name: Validate installed registry commands
        run: |
          set -euo pipefail
          sc skills --json > /tmp/sc-skills.json
          node bin/sc.js skill list --json > /tmp/legacy-skills.json
          node - <<'NODE'
          const fs = require('fs');
          const installed = JSON.parse(fs.readFileSync('/tmp/sc-skills.json', 'utf8'));
          const legacy = JSON.parse(fs.readFileSync('/tmp/legacy-skills.json', 'utf8'));
          const required = ['sc','sc-all','sc-fe','sc-ui','sc-ux','sc-dx','sc-ax'];
          for (const name of required) {
            if (!installed.skills.some(x => x.name === name)) throw new Error(`installed sc missing ${name}`);
            if (!legacy.skills.some(x => x.name === name)) throw new Error(`bin/sc.js missing ${name}`);
          }
          console.log(`installed-count=${installed.skills.length}`);
          console.log(`legacy-count=${legacy.skills.length}`);
          console.log(`required=${required.join(',')}`);
          NODE
          sc skill show sc-fe --json

      - name: Validate Finder exposes and opens Skills from the installed CLI
        shell: bash
        run: |
          set -euo pipefail
          # The TUI has a filter: type "skills", Enter the only matching branch,
          # then capture the rendered skill list from the actual globally linked `sc`.
          (printf 'skills\r'; sleep 1) | timeout 3s script -qfec 'sc' /tmp/sc-tui.raw || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path('/tmp/sc-tui.raw').read_text(errors='replace')
          clean = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          clean = re.sub(r'\x1b\][^\x07]*(?:\x07|\x1b\\)', '', clean)
          Path('/tmp/sc-tui.txt').write_text(clean)
          print(clean[-16000:])
          required = ['Skills', '/sc-fe', '/sc-ui', '/sc-ux', '/sc-dx', '/sc-ax']
          missing = [value for value in required if value not in clean]
          if missing:
              raise SystemExit(f'installed Finder/TUI missing: {missing}')
          if 'SI-Coder › Skills' not in clean:
              raise SystemExit('installed Finder/TUI did not actually enter the Skills branch')
          PY
