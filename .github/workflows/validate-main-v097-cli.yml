name: Validate merged main v0.9.7 CLI

on:
  push:
    branches:
      - feat/skill-search-auto-metadata
    paths:
      - .github/workflows/validate-main-v097-cli.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Validate exact merged main binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "263789f6512c3175414e36dd8e1ab5ee8666d8bc"
          test "$(node -p "require('./package.json').version")" = "0.9.7"
          npm ci --ignore-scripts --no-audit --no-fund
          npm link
          command -v sc
          command -v sc-skill
          sc skills ui --json > /tmp/main-ui.json
          sc-skill "accessibility mobile" --json > /tmp/main-a11y.json
          sc-skill --new > /tmp/main-contract.json
          node - <<'NODE'
          const fs = require('fs');
          const ui = JSON.parse(fs.readFileSync('/tmp/main-ui.json','utf8'));
          if (ui.version !== 1 || ui.source !== 'si-coder' || !ui.skills.some(x => x.name === 'sc-ui')) throw new Error('main registry search failed');
          const a11y = JSON.parse(fs.readFileSync('/tmp/main-a11y.json','utf8'));
          if (!a11y.skills.some(x => x.name === 'sc-ux')) throw new Error('main multi-token search failed');
          const contract = JSON.parse(fs.readFileSync('/tmp/main-contract.json','utf8'));
          if (contract.command !== 'sc-skill --new') throw new Error('main sc-skill contract failed');
          NODE
      - name: Validate merged main Finder fuzzy search
        shell: bash
        run: |
          set -euo pipefail
          (printf 'skills\r'; sleep 0.5; printf 'interfce'; sleep 1) | timeout 4s script -qfec 'sc' /tmp/main-v097-finder.raw || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path('/tmp/main-v097-finder.raw').read_text(errors='replace')
          clean = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          clean = re.sub(r'\x1b\][^\x07]*(?:\x07|\x1b\\)', '', clean)
          print(clean[-14000:])
          for expected in ['SI-Coder › Skills', 'interfce', '/sc-ui']:
              if expected not in clean:
                  raise SystemExit(f'merged main fuzzy Finder missing {expected!r}')
          PY
