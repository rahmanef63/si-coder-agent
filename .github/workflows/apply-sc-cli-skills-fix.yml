name: Apply SC CLI Skills SSOT fix

on:
  push:
    branches:
      - fix/sc-cli-skills-ssot
    paths:
      - .github/workflows/apply-sc-cli-skills-fix.yml
      - scripts/tmp-apply-cli-skills-fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/sc-cli-skills-ssot
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply patch and verify
        run: |
          set -euo pipefail
          python3 scripts/tmp-apply-cli-skills-fix.py
          npm ci --ignore-scripts --no-audit --no-fund
          node --check bin/sc.js
          npm test
          npm run docs:check
          npm run verify:release

      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/sc.js test/sc-console.test.js docs/cli.md
          git commit -m "fix(cli): make Skills a first-class Finder SSOT resource"
          git push origin HEAD:fix/sc-cli-skills-ssot
