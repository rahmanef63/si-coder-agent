name: Apply SC CLI Skills SSOT fix

on:
  push:
    branches:
      - fix/sc-cli-skills-ssot
    paths:
      - .github/workflows/apply-sc-cli-skills-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/sc-cli-skills-ssot
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Add Skills to Finder SSOT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('bin/sc.js')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          replace_once(
              "const { listSkills } = require(path.resolve(__dirname, '../lib/skill-registry'));\n",
              "const { listSkills } = require(path.resolve(__dirname, '../lib/skill-registry'));\nconst SkillStore = require(path.resolve(__dirname, '../lib/skill-store'));\n",
              'skill store import'
          )

          replace_once(
              "  { id: 'build', label: 'Build' },\n  { id: 'catalog', label: 'Providers' },",
              "  { id: 'build', label: 'Build' },\n  { id: 'skills', label: 'Skills' },\n  { id: 'catalog', label: 'Providers' },",
              'top Skills section'
          )

          replace_once(
              "    { id: 'build',    kind: 'action', label: 'Build / publish', hint: 'plan the simplest suitable route' },\n    { id: 'catalog',  kind: 'branch', label: 'Provider catalog', hint: 'available integrations; credentials live under Users' },",
              "    { id: 'build',    kind: 'action', label: 'Build / publish', hint: 'plan the simplest suitable route' },\n    { id: 'skills',   kind: 'branch', label: 'Skills', hint: 'registered slash skills; inspect bundled skills and CRUD project/global skills' },\n    { id: 'catalog',  kind: 'branch', label: 'Provider catalog', hint: 'available integrations; credentials live under Users' },",
              'root Skills branch'
          )

          anchor = "  if (here === 'catalog') {\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'skills menu anchor: expected exactly one match, got {s.count(anchor)}')
          skills_menu = r'''  if (here === 'skills') {
    const rows = listSkills();
    return [
      { id: 'add', kind: 'action', label: 'Add skill', hint: 'create a project or global managed slash skill' },
      ...rows.map(row => ({
        id: `skill:${row.id}`,
        kind: 'branch',
        pathLabel: row.invocation,
        label: row.invocation,
        hint: `${row.scope} · ${row.mutable ? 'editable' : 'read-only'} · ${row.description || 'no description'}`,
        preview: [
          `${row.invocation} · ${row.scope} · ${row.mutable ? 'editable' : 'read-only'}`,
          row.description || 'No description.',
          `id: ${row.id}`,
          `path: ${row.path}`,
        ],
      })),
    ];
  }

  const skillNode = [...stack].reverse().find(x => x.id.startsWith('skill:'));
  if (skillNode && here.startsWith('skills/skill:')) {
    const skillId = skillNode.id.slice('skill:'.length);
    const row = SkillStore.showSkill(skillId);
    return [
      { id: 'details', kind: 'action', label: 'Skill details', hint: `${row.invocation} · ${row.scope} · ${row.mutable ? 'editable' : 'read-only'}`, preview: [row.description || 'No description.', `id: ${row.id}`, `path: ${row.path}`] },
      ...(row.scope === 'bundled' ? [{ id: 'override', kind: 'action', label: 'Create project override', hint: 'copy this bundled skill into .mso/skills so it becomes project-editable' }] : []),
      ...(row.mutable ? [
        { id: 'edit-description', kind: 'action', label: 'Edit description', hint: 'update frontmatter description and revalidate the skill' },
        { id: 'replace-file', kind: 'action', label: 'Replace from SKILL.md', hint: 'replace the managed skill from a local file with validation + rollback' },
        { id: 'delete', kind: 'action', label: 'Delete skill', hint: 'remove this managed skill after explicit confirmation' },
      ] : []),
    ];
  }

'''
          s = s.replace(anchor, skills_menu + anchor, 1)

          action_anchor = "    if (provider && here === `catalog/provider:${provider}` && item.id === 'details') {\n"
          if s.count(action_anchor) != 1:
              raise SystemExit(f'skills action anchor: expected exactly one match, got {s.count(action_anchor)}')
          skills_actions = r'''    if (here === 'skills' && item.id === 'add') {
      const name = await askVisible('Skill name: ', { escapeCancels: true });
      if (name === null) return 'cancel';
      const scope = await selectOne('Skill scope', [
        { id: 'project', label: 'Project', hint: '.mso/skills · highest normal precedence' },
        { id: 'global', label: 'Global', hint: '~/.mso/skills · reusable across projects' },
      ]);
      if (!scope) return 'cancel';
      const description = await askVisible('Description: ', { escapeCancels: true });
      if (description === null) return 'cancel';
      const created = SkillStore.createSkill({ name, scope, description });
      console.log(`created ${created.id} -> ${created.path} · invoke ${created.invocation}`);
      return;
    }

    const skillNode = [...stack].reverse().find(x => x.id.startsWith('skill:'));
    if (skillNode && here.startsWith('skills/skill:')) {
      const skillId = skillNode.id.slice('skill:'.length);
      const row = SkillStore.showSkill(skillId);
      if (item.id === 'details') {
        console.log(`skill: ${row.id}`);
        console.log(`invoke: ${row.invocation}`);
        console.log(`scope: ${row.scope}`);
        console.log(`mode: ${row.mutable ? 'editable' : 'read-only'}`);
        console.log(`path: ${row.path}`);
        if (row.description) console.log(`description: ${row.description}`);
        return;
      }
      if (item.id === 'override') {
        const sourceFile = path.join(row.path, 'SKILL.md');
        const created = SkillStore.createSkill({ name: row.name, scope: 'project', fromFile: sourceFile });
        console.log(`created ${created.id} override -> ${created.path}`);
        return;
      }
      if (item.id === 'edit-description') {
        const description = await askVisible('New description: ', { escapeCancels: true });
        if (description === null) return 'cancel';
        const updated = SkillStore.updateSkill(skillId, { description });
        console.log(`updated ${updated.id}`);
        return;
      }
      if (item.id === 'replace-file') {
        const fromFile = await askVisible('SKILL.md path: ', { escapeCancels: true });
        if (fromFile === null) return 'cancel';
        const updated = SkillStore.updateSkill(skillId, { fromFile });
        console.log(`updated ${updated.id} from ${fromFile}`);
        return;
      }
      if (item.id === 'delete') {
        if (!await confirm(`Delete managed skill "${row.id}" and its directory?`)) return 'cancel';
        const deleted = SkillStore.deleteSkill(row.id);
        console.log(`deleted ${deleted.id}`);
        return;
      }
    }

'''
          s = s.replace(action_anchor, skills_actions + action_anchor, 1)

          terminal_anchor = "  if (here === 'users' && item.id === 'add') return true;\n"
          if s.count(terminal_anchor) != 1:
              raise SystemExit(f'terminal anchor: expected exactly one match, got {s.count(terminal_anchor)}')
          terminal_new = terminal_anchor + "  if (here === 'skills' && item.id === 'add') return true;\n  if (here.startsWith('skills/skill:') && ['override', 'edit-description', 'replace-file', 'delete'].includes(item.id)) return true;\n"
          s = s.replace(terminal_anchor, terminal_new, 1)

          p.write_text(s)

          # Permanent regression checks: Finder must expose Skills and use the same registry/store.
          t = Path('test/sc-console.test.js')
          ts = t.read_text()
          marker = "  assert.match(sc, /enterAlternateScreen\\(\\)/, 'bare sc must enter one stable TUI frame');"
          if marker not in ts:
              raise SystemExit('sc-console test marker not found')
          ts = ts.replace(marker, marker + "\n  assert.match(sc, /id: 'skills', label: 'Skills'/, 'Finder top sections must expose Skills');\n  assert.match(sc, /label: 'Skills'.*registered slash skills/, 'Finder root must expose the skill registry');\n  assert.match(sc, /SkillStore\\.createSkill/, 'Finder must create managed skills through the canonical skill store');\n  assert.match(sc, /SkillStore\\.updateSkill/, 'Finder must update managed skills through the canonical skill store');\n  assert.match(sc, /SkillStore\\.deleteSkill/, 'Finder must delete managed skills through the canonical skill store');", 1)
          t.write_text(ts)

          d = Path('docs/cli.md')
          ds = d.read_text()
          ds = ds.replace('SECTIONS   [ Users ]   Build   Providers   System', 'SECTIONS   [ Users ]   Transfer   Build   Skills   Providers   System')
          if '## Skill registry and CRUD' not in ds:
              ds += r'''

## Skill registry and CRUD

The Finder has a first-class **Skills** section backed by the same registry as `sc skills --json`. It lists bundled active/default skills plus project/global managed skills, shows scope/source/path/invocation, and exposes CRUD actions for mutable skills.

```text
Skills
├─ Add skill
├─ /sc                 bundled · read-only
├─ /sc-fe              bundled · read-only
├─ /release-check      project · editable
└─ /team-check         global · editable
```

Bundled package skills stay read-only; choose **Create project override** to copy a bundled skill into `.mso/skills/<name>/SKILL.md` before editing it. Managed skill writes use the canonical skill store with validation and rollback.
'''
          d.write_text(ds)
          PY

          npm ci --ignore-scripts --no-audit --no-fund
          node --check bin/sc.js
          npm test
          npm run docs:check
          npm run verify:release

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/sc.js test/sc-console.test.js docs/cli.md
          git commit -m "fix(cli): make Skills a first-class Finder SSOT resource"
          git push origin HEAD:fix/sc-cli-skills-ssot
