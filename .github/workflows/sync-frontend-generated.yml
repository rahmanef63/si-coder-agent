name: Sync frontend generated artifacts

on:
  push:
    branches: [feat/sc-frontend-quality]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/sc-frontend-quality

      - name: Regenerate skill artifacts from canonical sources
        run: python3 scripts/package-web-skill.py

      - name: Commit generated artifacts when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist plugins/si-coder
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "chore(frontend): sync generated skill artifacts"
          git push origin HEAD:feat/sc-frontend-quality
