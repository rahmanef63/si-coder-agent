name: Publish verified v0.9.8

on:
  push:
    branches:
      - fix/update-auto-preserve-dirty
    paths:
      - .github/workflows/publish-v098.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify v0.9.8 tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 4d6f6f7efed552060ecb07ae02932ed7fd78d997
          RELEASE_TAG: v0.9.8
        shell: bash
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$RELEASE_SHA" >/dev/null
          fi
      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag=v0.9.8
